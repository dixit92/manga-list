name: Build Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      # Required for creating the release and uploading assets on tag pushes.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = "0.0.0+$($env:GITHUB_SHA.Substring(0, 7))"
          }
          Write-Host "Building version $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=MangaList-v$v-win-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stamp version
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Set-Content -Path 'manga_list/_version.py' -Encoding utf8 -Value @(
            '"""Version stamped by CI at build time."""'
            ''
            "__version__ = '$v'"
          )

      - name: Build executable
        run: |
          pyinstaller MangaList.spec --clean --noconfirm

      - name: Package zip bundle
        shell: pwsh
        run: |
          $name = '${{ steps.ver.outputs.name }}'
          New-Item -ItemType Directory -Path "package/$name" -Force | Out-Null
          Copy-Item 'dist/MangaList.exe' "package/$name/"
          Copy-Item 'README.md', 'LICENSE' "package/$name/"
          # Archive the folder itself so unzipping creates a single directory.
          Compress-Archive -Path "package/$name" -DestinationPath "package/$name.zip"
          $hash = (Get-FileHash "package/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "package/$name.zip.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: |
            package/*.zip
            package/*.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            package/*.zip
            package/*.zip.sha256
          draft: true
          generate_release_notes: true
